theme: jekyll-theme-chirpy

lang: pt-BR
timezone: America/Sao_Paulo

title: Lucas Dev
tagline: Desenvolvedor Full Stack em Formação
email: lucasfisio.ramos@gmail.com
description: >-
  Desenvolvedor de software em formação, com foco em backend e aplicações web.
  Construo soluções utilizando Python, Flask, SQL, Docker e Git, buscando criar
  sistemas escaláveis, bem estruturados e orientados à resolução de problemas reais.

url: "https://lucasfisioramos-cmyk.github.io"
baseurl: ""

github:
  username: lucasfisioramos-cmyk

twitter:
  username:

social:
  name: Lucas
  email: lucasfisio.ramos@gmail.com
  links:
    - https://meuprojetogit-omega.vercel.app/
    - https://github.com/lucasfisioramos-cmyk

webmaster_verifications: {}

theme_mode:

avatar:

analytics:
  google:
    id:
  goatcounter:
    id:
  umami:
    id:
    domain:
  matomo:
    id:
    domain:
  cloudflare:
    id:
  fathom:
    id:

pageviews:
  provider:

comments:
  provider:

assets:
  self_host:
    enabled:
    env:

pwa:
  enabled: true
  cache:
    enabled: true
    deny_paths:

paginate: 10

plugins:
  - jekyll-seo-tag

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - "node_modules"
  - "vendor"
  - "_site"
  - ".bundle"
  - ".sass-cache"
  - ".jekyll-cache"
  - ".jekyll-metadata"
  - "Gemfile"
  - "Gemfile.lock"
